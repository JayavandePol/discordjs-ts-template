name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node.js line that is still supported: 22 (maintenance), 24 and 26 (LTS)
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Fails when a schema change was committed without its migration
      - name: Check migrations match the schema
        if: matrix.node-version == '24.x'
        run: |
          DATABASE_URL=":memory:" npx drizzle-kit generate
          DATABASE_URL="postgres://ci:ci@localhost:5432/ci" npx drizzle-kit generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"
